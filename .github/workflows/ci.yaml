name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

# Une nouvelle poussée sur la même branche annule le run précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# La version de Rust vient de rust-toolchain.toml (rustup l'installe tout seul).
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Docker est dispo sur ubuntu-latest : les tests testcontainers
      # (Postgres + pgvector éphémère) tourneront ici sans config en plus.
      - run: cargo test --workspace --locked
